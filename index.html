<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Kareba'Ta" />
    <meta name="apple-mobile-web-app-title" content="Kareba'Ta" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Kareba'Ta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Cpath d='M50 118C47 108 10 70 10 46A40 40 0 1 1 90 46C90 70 53 108 50 118Z' fill='%23E5A000'/%3E%3Cpath d='M30 25H41V44.5L59.5 25H73.5L50.5 47.5L74.5 71H60.5L41 51V71H30V25Z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <meta name="description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:title" content="Kareba'Ta" />
    <meta property="og:description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!-- High-Definition Vector Splash Screen rendered instantly on app launch -->
      <div id="pwa-splash-preloader" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;">
          <!-- Vector Pin SVG: 100% Crisp at any pixel density -->
          <div style="filter:drop-shadow(0 10px 22px rgba(229,160,0,0.35));margin-bottom:16px;">
            <svg viewBox="0 0 100 120" width="88" height="106" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 50 118 C 47 108 10 70 10 46 A 40 40 0 1 1 90 46 C 90 70 53 108 50 118 Z" fill="#E5A000" />
              <path d="M 30 25 H 41 V 44.5 L 59.5 25 H 73.5 L 50.5 47.5 L 74.5 71 H 60.5 L 41 51 V 71 H 30 V 25 Z" fill="#ffffff" />
            </svg>
          </div>
          <!-- Brand Name: Kareba'Ta -->
          <div style="font-size:36px;font-weight:900;letter-spacing:-0.03em;line-height:1;margin-bottom:6px;">
            <span style="color:#00632B;">Kareba'</span><span style="color:#E5A000;">Ta</span>
          </div>
          <!-- Slogan: BERITAMU, SUARAMU -->
          <div style="font-size:11px;font-weight:800;letter-spacing:0.16em;color:#E5A000;text-transform:uppercase;margin-bottom:28px;">
            BERITAMU, SUARAMU
          </div>
          <!-- Subtle Sleek Loading Bar -->
          <div style="width:48px;height:3px;background:#f3f4f6;border-radius:99px;overflow:hidden;position:relative;">
            <div style="position:absolute;inset:0;background:#00632B;border-radius:99px;animation:pwaSplashPulse 1s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes pwaSplashPulse {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
