<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Kareba'Ta" />
    <meta name="apple-mobile-web-app-title" content="Kareba'Ta" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png?v=2" />
    <title>Kareba'Ta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:title" content="Kareba'Ta" />
    <meta property="og:description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="karebata-initial-splash" style="position:fixed;inset:0;z-index:999999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:'Poppins',system-ui,sans-serif;-webkit-user-select:none;user-select:none;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <!-- Ikon Pin Emas Berhuruf K -->
          <div style="margin-bottom:16px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.08));">
            <svg width="84" height="84" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M 50 118 C 47 108 10 70 10 46 A 40 40 0 1 1 90 46 C 90 70 53 108 50 118 Z" fill="#E5A000" />
              <path d="M 30 25 H 41 V 44.5 L 59.5 25 H 73.5 L 50.5 47.5 L 74.5 71 H 60.5 L 41 51 V 71 H 30 V 25 Z" fill="#ffffff" />
            </svg>
          </div>

          <!-- Nama Brand: Kareba'Ta -->
          <h1 style="font-size:42px;font-weight:900;letter-spacing:-0.03em;line-height:1;margin:0 0 6px 0;display:flex;align-items:center;justify-content:center;">
            <span style="color:#00632B;">Kareba&apos;</span><span style="color:#E5A000;">Ta</span>
          </h1>

          <!-- Slogan Asli: BERITAMU, SUARAMU -->
          <p style="font-size:12px;font-weight:800;letter-spacing:0.16em;color:#E5A000;text-transform:uppercase;margin:0 0 32px 0;">
            BERITAMU, SUARAMU
          </p>

          <!-- Batang Pemuatan (Loading Bar) yang Berjalan Nyata -->
          <div style="width:176px;height:10px;background:#f5f5f5;border-radius:9999px;overflow:hidden;border:1px solid rgba(229,231,235,0.9);position:relative;">
            <div id="initial-bar-fill" style="height:100%;background:linear-gradient(to right, #00632B, #10b981, #E5A000);border-radius:9999px;animation:karebaFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes karebaFill {
          0% { width: 10%; }
          50% { width: 70%; }
          100% { width: 95%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
