<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="Kareba'Ta" />
    <meta name="apple-mobile-web-app-title" content="Kareba'Ta" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Kareba'Ta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'%3E%3Cpath d='M50 118C47 108 10 70 10 46A40 40 0 1 1 90 46C90 70 53 108 50 118Z' fill='%23E5A000'/%3E%3Cpath d='M30 25H41V44.5L59.5 25H73.5L50.5 47.5L74.5 71H60.5L41 51V71H30V25Z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <meta name="description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:title" content="Kareba'Ta" />
    <meta property="og:description" content="Kareba'Ta - beritamu, suaramu. Media sosial kabar dan momen warga terkini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;z-index:999999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:'Poppins',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <!-- Pin Emas KarebaTa -->
          <div style="margin-bottom:16px;filter:drop-shadow(0 4px 6px rgba(212,139,0,0.25));">
            <svg width="84" height="100" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M50 118C47 108 10 70 10 46A40 40 0 1 1 90 46C90 70 53 108 50 118Z" fill="url(#pinGradHtml)" />
              <path d="M30 25H41V44.5L59.5 25H73.5L50.5 47.5L74.5 71H60.5L41 51V71H30V25Z" fill="#ffffff" />
              <defs>
                <linearGradient id="pinGradHtml" x1="15%" y1="0%" x2="85%" y2="100%">
                  <stop offset="0%" stop-color="#FFB703" />
                  <stop offset="50%" stop-color="#E5A000" />
                  <stop offset="100%" stop-color="#D48B00" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <!-- Teks Brand: Kareba'Ta -->
          <h1 style="font-size:38px;font-weight:900;letter-spacing:-0.03em;line-height:1;margin:0 0 6px 0;display:flex;align-items:center;justify-content:center;">
            <span style="color:#00632B;">Kareba&apos;</span><span style="color:#E5A000;">Ta</span>
          </h1>
          <!-- Slogan Resmi: BERITAMU, SUARAMU -->
          <p style="font-size:12px;font-weight:800;letter-spacing:0.16em;color:#E5A000;text-transform:uppercase;margin:0 0 32px 0;">
            BERITAMU, SUARAMU
          </p>
          <!-- Bar Loading Berjalan -->
          <div style="width:176px;height:10px;background:#f3f4f6;border-radius:9999px;overflow:hidden;border:1px solid rgba(229,231,235,0.9);position:relative;">
            <div id="initial-progress" style="height:100%;width:15%;background:linear-gradient(to right,#00632B,#10b981,#E5A000);border-radius:9999px;animation:karebaProgress 1.6s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes karebaProgress {
          0% { width: 8%; }
          50% { width: 68%; }
          100% { width: 96%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
