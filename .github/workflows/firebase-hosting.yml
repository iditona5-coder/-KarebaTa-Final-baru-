name: Deploy ke Firebase Hosting saat penggabungan
'on':
  push:
    branches:
      - main
      - utama
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAREBA_TA_UGI }}'
          channelId: live
          projectId: karebata-ugi
          target: kareba-ta-ugi99
